  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .page-hero { padding: 40px 40px 32px; max-width: 900px; margin: 0 auto; border-bottom: 1px solid var(--border); }
    .page-hero h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .page-hero p  { font-size: 13px; color: var(--text-light); line-height: 1.8; }

    .app-list { max-width: 900px; margin: 0 auto; padding: 32px 40px 48px; }
    .list-label {
      font-size: 11px; letter-spacing: 0.15em; color: var(--text-light);
      text-transform: uppercase; margin-bottom: 20px; font-weight: 500;
    }

    .app-row {
      display: flex; align-items: center; gap: 20px;
      padding: 22px 4px; text-decoration: none;
      border-top: 1px solid var(--border);
      transition: background 0.15s; position: relative;
    }
    .app-row:last-of-type { border-bottom: 1px solid var(--border); }
    a.app-row:hover { background: var(--card-hover); }
    a.app-row:hover .app-arrow { transform: translateX(4px); color: var(--accent); }

    .app-num {
      font-size: 12px; color: var(--text-light); font-weight: 500;
      letter-spacing: 0.1em; width: 28px; flex-shrink: 0;
    }
    .app-body { flex: 1; }
    .app-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .app-desc  { font-size: 12px; color: var(--text-light); line-height: 1.7; }

    .app-arrow { font-size: 16px; color: var(--border); transition: all 0.15s; flex-shrink: 0; }

    @media (max-width: 768px) {
      .page-hero { padding: 24px 20px; }
      .app-list { padding: 24px 20px 40px; }
      .app-row { gap: 12px; }
    }
  </style>
</head>
