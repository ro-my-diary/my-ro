<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD金銭効率シミュレーター - RO活動日記</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .page-hero {
      padding: 40px 40px 32px;
      max-width: 1100px;
      margin: 0 auto;
      border-bottom: 1px solid var(--border);
    }

    .page-hero h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .page-hero p {
      font-size: 13px;
      color: var(--text-light);
    }

    .sim-section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 40px;
    }

    .sim-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    /* MDカード */
    .md-card {
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .md-card-header {
      background: #f7f7f7;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .md-card-header input.md-name {
      font-size: 14px;
      font-weight: 700;
      font-family: 'Noto Sans JP', sans-serif;
      border: none;
      background: transparent;
      color: var(--text);
      flex: 1;
      outline: none;
    }

    .md-card-header input.md-name::placeholder {
      color: #bbb;
      font-weight: 400;
    }

    .result-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .result-badge.positive {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .result-badge.negative {
      background: #fdecea;
      color: #c62828;
    }

    .result-badge.neutral {
      background: #f0f0f0;
      color: #888;
    }

    .md-card-body {
      padding: 14px 16px;
    }

    /* 時間設定行 */
    .time-row {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .time-field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-light);
    }

    .time-field input {
      width: 60px;
      font-size: 13px;
      font-family: 'Noto Sans JP', sans-serif;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      text-align: right;
      outline: none;
      color: var(--text);
    }

    .time-field input:focus {
      border-color: #aaa;
    }

    /* アイテムテーブル */
    .item-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .item-table thead th {
      text-align: left;
      color: var(--text-light);
      font-weight: 500;
      padding: 4px 6px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    .item-table tbody td {
      padding: 3px 4px;
    }

    .item-table input {
      width: 100%;
      font-size: 12px;
      font-family: 'Noto Sans JP', sans-serif;
      border: 1px solid transparent;
      border-radius: 3px;
      padding: 4px 6px;
      outline: none;
      color: var(--text);
      background: transparent;
      transition: border-color 0.1s, background 0.1s;
    }

    .item-table input:focus {
      border-color: var(--border);
      background: #fafafa;
    }

    .item-table input.drop-input {
      text-align: right;
      width: 70px;
    }

    .item-table input.price-input {
      text-align: right;
    }

    .item-table .expected {
      text-align: right;
      padding: 4px 6px;
      color: var(--text-light);
      font-size: 11px;
      white-space: nowrap;
    }

    /* 経費・時給行 */
    .summary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .expense-field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-light);
    }

    .expense-field input {
      width: 100px;
      font-size: 13px;
      font-family: 'Noto Sans JP', sans-serif;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      text-align: right;
      outline: none;
      color: var(--text);
    }

    .hourly-result {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .hourly-result span {
      font-size: 18px;
    }

    .hourly-result.positive span { color: #2e7d32; }
    .hourly-result.negative span { color: #c62828; }

    @media (max-width: 768px) {
      .page-hero { padding: 24px 20px; }
      .sim-section { padding: 24px 20px; }
      .sim-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <a class="site-title" href="index.html">RO<span>活動</span>日記</a>
    <nav>
      <a href="bazaar.html">露店巡り</a>
      <a href="md-sim.html" style="color:var(--accent)">MD金銭効率</a>
      <a href="enchant.html">エンチャまとめ</a>
      <a class="disabled">工事中①</a>
      <a class="disabled">工事中②</a>
      <a class="disabled">工事中③</a>
      <a class="disabled">工事中④</a>
      <a class="disabled">工事中⑤</a>
    </nav>
  </header>

  <div class="page-hero">
    <div class="hero-tag">Simulator</div>
    <h1>MD金銭効率シミュレーター</h1>
    <p>MD名・時間・ドロップ情報・必要経費を入力すると時給を自動計算します。</p>
  </div>

  <div class="sim-section">
    <div class="sim-grid" id="simGrid"></div>
  </div>

  <footer>
    © 2026 RO活動日記
  </footer>

  <script>
    const CARD_COUNT = 10;
    const ITEM_ROWS = 6;

    function formatZ(n) {
      if (isNaN(n) || !isFinite(n)) return '---';
      return Math.round(n).toLocaleString() + ' z';
    }

    function calcCard(card) {
      const prepSec  = parseFloat(card.querySelector('.prep-sec').value)  || 0;
      const sets     = parseFloat(card.querySelector('.sets').value)      || 0;
      const setSec   = parseFloat(card.querySelector('.set-sec').value)   || 0;
      const expense  = parseFloat(card.querySelector('.expense').value)   || 0;

      const totalSec = prepSec + sets * setSec;

      let expectedTotal = 0;
      card.querySelectorAll('.item-row').forEach(row => {
        const drop  = parseFloat(row.querySelector('.drop-input').value)  || 0;
        const price = parseFloat(row.querySelector('.price-input').value) || 0;
        const exp   = (drop / 100) * price;
        expectedTotal += exp;
        row.querySelector('.expected').textContent = exp > 0 ? formatZ(exp) : '';
      });

      const totalExpected = expectedTotal * sets;
      const hourly = totalSec > 0 ? (totalExpected / totalSec * 3600) - expense : null;

      // バッジ更新
      const badge = card.querySelector('.result-badge');
      const hourlyEl = card.querySelector('.hourly-result');

      if (hourly === null || totalSec === 0) {
        badge.textContent = '未入力';
        badge.className = 'result-badge neutral';
        hourlyEl.innerHTML = '時給 <span>---</span>';
        hourlyEl.className = 'hourly-result';
      } else if (hourly >= 0) {
        badge.textContent = '黒字';
        badge.className = 'result-badge positive';
        hourlyEl.innerHTML = `時給 <span>${Math.round(hourly).toLocaleString()} z</span>`;
        hourlyEl.className = 'hourly-result positive';
      } else {
        badge.textContent = '赤字';
        badge.className = 'result-badge negative';
        hourlyEl.innerHTML = `時給 <span>${Math.round(hourly).toLocaleString()} z</span>`;
        hourlyEl.className = 'hourly-result negative';
      }
    }

    function buildCard(index) {
      const card = document.createElement('div');
      card.className = 'md-card';

      // ヘッダー
      card.innerHTML = `
        <div class="md-card-header">
          <input class="md-name" type="text" placeholder="MD名を入力">
          <span class="result-badge neutral">未入力</span>
        </div>
        <div class="md-card-body">
          <div class="time-row">
            <div class="time-field">
              準備 <input class="prep-sec" type="number" min="0" placeholder="0"> 秒
            </div>
            <div class="time-field">
              <input class="sets" type="number" min="1" placeholder="1"> セット ×
              <input class="set-sec" type="number" min="0" placeholder="0"> 秒
            </div>
          </div>

          <table class="item-table">
            <thead>
              <tr>
                <th>アイテム名</th>
                <th style="width:70px">ドロップ率%</th>
                <th style="width:90px">金額 (z)</th>
                <th style="width:80px">期待値/set</th>
              </tr>
            </thead>
            <tbody>
              ${Array.from({length: ITEM_ROWS}, () => `
                <tr class="item-row">
                  <td><input type="text" placeholder="アイテム名"></td>
                  <td><input class="drop-input" type="number" min="0" max="100" step="0.01" placeholder="0.00"></td>
                  <td><input class="price-input" type="number" min="0" placeholder="0"></td>
                  <td class="expected"></td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <div class="summary-row">
            <div class="expense-field">
              必要経費 <input class="expense" type="number" min="0" placeholder="0"> z/時
            </div>
            <div class="hourly-result">時給 <span>---</span></div>
          </div>
        </div>
      `;

      // イベント：全inputの変更で再計算
      card.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', () => calcCard(card));
      });

      return card;
    }

    const grid = document.getElementById('simGrid');
    for (let i = 0; i < CARD_COUNT; i++) {
      grid.appendChild(buildCard(i));
    }
  </script>

</body>
</html>
