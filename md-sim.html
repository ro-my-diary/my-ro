<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD金銭効率シミュレーター - RO活動日記</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    .page-hero { padding: 40px 40px 32px; max-width: 1100px; margin: 0 auto; border-bottom: 1px solid var(--border); }
    .page-hero h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .page-hero p  { font-size: 13px; color: var(--text-light); }

    /* セーブ/ロードエリア */
    .saveload-section {
      max-width: 1100px; margin: 0 auto;
      padding: 24px 40px 0;
    }
    .saveload-label {
      font-size: 11px; letter-spacing: 0.12em; color: var(--text-light);
      text-transform: uppercase; margin-bottom: 10px; font-weight: 500;
    }
    .saveload-slots {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .slot-btn {
      display: flex; gap: 4px; align-items: center;
      border: 1px solid var(--border); border-radius: 4px;
      overflow: hidden; font-family: 'Noto Sans JP', sans-serif;
    }
    .slot-label {
      font-size: 12px; padding: 5px 10px;
      color: var(--text-light); background: #f7f7f7;
      border-right: 1px solid var(--border);
      white-space: nowrap;
    }
    .slot-save, .slot-load {
      font-size: 12px; padding: 5px 10px;
      border: none; cursor: pointer; font-family: 'Noto Sans JP', sans-serif;
      transition: background 0.12s;
    }
    .slot-save { background: #fff; color: var(--text); border-right: 1px solid var(--border); }
    .slot-save:hover { background: #f0f0f0; }
    .slot-load { background: #fff; color: var(--accent); }
    .slot-load:hover { background: var(--accent-light); }
    .slot-load.empty { color: #ccc; cursor: default; }
    .slot-load.empty:hover { background: #fff; }

    .sim-section { max-width: 1100px; margin: 0 auto; padding: 24px 40px 40px; }
    .sim-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }

    .md-card { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .md-card-header {
      background: #f7f7f7; padding: 12px 16px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .md-card-header input.md-name {
      font-size: 14px; font-weight: 700;
      font-family: 'Noto Sans JP', sans-serif;
      border: none; background: transparent;
      color: var(--text); flex: 1; outline: none;
    }
    .md-card-header input.md-name::placeholder { color: #bbb; font-weight: 400; }

    .result-badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
    .result-badge.positive { background: #e8f5e9; color: #2e7d32; }
    .result-badge.negative { background: #fdecea; color: #c62828; }
    .result-badge.neutral  { background: #f0f0f0; color: #888; }

    .md-card-body { padding: 14px 16px; }

    .time-row { display: flex; gap: 16px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
    .time-field { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-light); }
    .time-field input {
      width: 60px; font-size: 13px; font-family: 'Noto Sans JP', sans-serif;
      border: 1px solid var(--border); border-radius: 4px;
      padding: 4px 8px; text-align: right; outline: none; color: var(--text);
    }
    .time-field input:focus { border-color: #aaa; }

    .item-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 12px; }
    .item-table thead th {
      text-align: left; color: var(--text-light); font-weight: 500;
      padding: 4px 6px; border-bottom: 1px solid var(--border);
      font-size: 11px; letter-spacing: 0.05em;
    }
    .item-table tbody td { padding: 3px 4px; }
    .item-table input {
      width: 100%; font-size: 12px; font-family: 'Noto Sans JP', sans-serif;
      border: 1px solid var(--border); border-radius: 3px;
      padding: 4px 6px; outline: none; color: var(--text); background: #fff;
      transition: border-color 0.1s;
    }
    .item-table input:focus { border-color: #aaa; background: #fafafa; }
    .item-table input.qty-input  { text-align: right; }
    .item-table input.price-input { text-align: right; }
    .item-table .expected { text-align: right; padding: 4px 6px; color: var(--text-light); font-size: 11px; white-space: nowrap; }

    .expense-area {
      border-top: 1px solid var(--border); padding-top: 10px;
      margin-bottom: 10px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
    }
    .expense-field { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-light); }
    .expense-field input {
      width: 90px; font-size: 13px; font-family: 'Noto Sans JP', sans-serif;
      border: 1px solid var(--border); border-radius: 4px;
      padding: 4px 8px; text-align: right; outline: none; color: var(--text);
    }
    .expense-field input:focus { border-color: #aaa; }

    .result-row { border-top: 1px solid var(--border); padding-top: 10px; display: flex; justify-content: flex-end; }
    .hourly-result { font-size: 13px; font-weight: 700; color: var(--text); }
    .hourly-result span { font-size: 18px; }
    .hourly-result.positive span { color: #2e7d32; }
    .hourly-result.negative span { color: #c62828; }

    @media (max-width: 768px) {
      .page-hero { padding: 24px 20px; }
      .saveload-section { padding: 16px 20px 0; }
      .sim-section { padding: 16px 20px 32px; }
      .sim-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <a class="site-title" href="index.html">RO<span>活動</span>日記</a>
    <nav>
      <a href="bazaar.html">露店巡り</a>
      <a href="md-sim.html" style="color:var(--accent)">MD金銭効率</a>
      <a href="enchant.html">エンチャまとめ</a>
      <a class="disabled">工事中①</a>
      <a class="disabled">工事中②</a>
      <a class="disabled">工事中③</a>
      <a class="disabled">工事中④</a>
      <a class="disabled">工事中⑤</a>
    </nav>
  </header>

  <div class="page-hero">
    <div class="hero-tag">Simulator</div>
    <h1>MD金銭効率シミュレーター</h1>
    <p>MD名・時間・アイテム情報・経費を入力すると時給を自動計算します。セーブ/ロードでデータを保存できます。</p>
  </div>

  <!-- セーブ/ロード -->
  <div class="saveload-section">
    <div class="saveload-label">Save / Load</div>
    <div class="saveload-slots" id="saveloadSlots"></div>
  </div>

  <div class="sim-section">
    <div class="sim-grid" id="simGrid"></div>
  </div>

  <footer>© 2026 RO活動日記</footer>

  <script>
    const CARD_COUNT  = 10;
    const ITEM_ROWS   = 6;
    const SLOT_COUNT  = 10;
    const STORAGE_KEY = 'md_sim_slot_';

    // ---- 計算 ----
    function formatZ(n) {
      if (isNaN(n) || !isFinite(n)) return '---';
      return Math.round(n).toLocaleString() + ' z';
    }

    function calcCard(card) {
      const prepSec    = parseFloat(card.querySelector('.prep-sec').value)    || 0;
      const sets       = parseFloat(card.querySelector('.sets').value)        || 0;
      const setSec     = parseFloat(card.querySelector('.set-sec').value)     || 0;
      const prepCost   = parseFloat(card.querySelector('.prep-cost').value)   || 0;
      const setExpense = parseFloat(card.querySelector('.set-expense').value) || 0;

      const totalSec = prepSec + sets * setSec;

      let expectedPerSet = 0;
      card.querySelectorAll('.item-row').forEach(row => {
        const qty   = parseFloat(row.querySelector('.qty-input').value)   || 0;
        const price = parseFloat(row.querySelector('.price-input').value) || 0;
        const exp   = qty * price;
        expectedPerSet += exp;
        row.querySelector('.expected').textContent = exp > 0 ? formatZ(exp) : '';
      });

      const totalIncome  = expectedPerSet * sets;
      const totalExpense = prepCost + setExpense * sets;
      const netIncome    = totalIncome - totalExpense;
      const hourly       = totalSec > 0 ? netIncome / totalSec * 3600 : null;

      const badge    = card.querySelector('.result-badge');
      const hourlyEl = card.querySelector('.hourly-result');

      if (hourly === null || totalSec === 0) {
        badge.textContent  = '未入力';
        badge.className    = 'result-badge neutral';
        hourlyEl.innerHTML = '時給 <span>---</span>';
        hourlyEl.className = 'hourly-result';
      } else if (hourly >= 0) {
        badge.textContent  = '黒字';
        badge.className    = 'result-badge positive';
        hourlyEl.innerHTML = `時給 <span>${Math.round(hourly).toLocaleString()} z</span>`;
        hourlyEl.className = 'hourly-result positive';
      } else {
        badge.textContent  = '赤字';
        badge.className    = 'result-badge negative';
        hourlyEl.innerHTML = `時給 <span>${Math.round(hourly).toLocaleString()} z</span>`;
        hourlyEl.className = 'hourly-result negative';
      }
    }

    // ---- カードのデータ取得/セット ----
    function getCardData(card) {
      const items = [];
      card.querySelectorAll('.item-row').forEach(row => {
        items.push({
          name:  row.querySelector('input[type=text]').value,
          qty:   row.querySelector('.qty-input').value,
          price: row.querySelector('.price-input').value,
        });
      });
      return {
        name:       card.querySelector('.md-name').value,
        prepSec:    card.querySelector('.prep-sec').value,
        sets:       card.querySelector('.sets').value,
        setSec:     card.querySelector('.set-sec').value,
        prepCost:   card.querySelector('.prep-cost').value,
        setExpense: card.querySelector('.set-expense').value,
        items,
      };
    }

    function setCardData(card, data) {
      card.querySelector('.md-name').value    = data.name       || '';
      card.querySelector('.prep-sec').value   = data.prepSec    || '';
      card.querySelector('.sets').value       = data.sets       || '';
      card.querySelector('.set-sec').value    = data.setSec     || '';
      card.querySelector('.prep-cost').value  = data.prepCost   || '';
      card.querySelector('.set-expense').value = data.setExpense || '';
      card.querySelectorAll('.item-row').forEach((row, i) => {
        const item = data.items && data.items[i];
        row.querySelector('input[type=text]').value  = item ? item.name  : '';
        row.querySelector('.qty-input').value        = item ? item.qty   : '';
        row.querySelector('.price-input').value      = item ? item.price : '';
      });
      calcCard(card);
    }

    // ---- セーブ/ロード ----
    function getAllData() {
      const cards = document.querySelectorAll('.md-card');
      return Array.from(cards).map(c => getCardData(c));
    }

    function saveSlot(slot) {
      localStorage.setItem(STORAGE_KEY + slot, JSON.stringify(getAllData()));
      updateSlotButtons();
    }

    function loadSlot(slot) {
      const raw = localStorage.getItem(STORAGE_KEY + slot);
      if (!raw) return;
      const data = JSON.parse(raw);
      document.querySelectorAll('.md-card').forEach((card, i) => {
        if (data[i]) setCardData(card, data[i]);
      });
    }

    function slotHasData(slot) {
      return !!localStorage.getItem(STORAGE_KEY + slot);
    }

    function updateSlotButtons() {
      document.querySelectorAll('.slot-load').forEach(btn => {
        const slot = btn.dataset.slot;
        if (slotHasData(slot)) {
          btn.classList.remove('empty');
          btn.textContent = 'ロード';
        } else {
          btn.classList.add('empty');
          btn.textContent = '(空)';
        }
      });
    }

    // ---- カードDOM生成 ----
    function buildCard() {
      const card = document.createElement('div');
      card.className = 'md-card';
      card.innerHTML = `
        <div class="md-card-header">
          <input class="md-name" type="text" placeholder="MD名を入力">
          <span class="result-badge neutral">未入力</span>
        </div>
        <div class="md-card-body">
          <div class="time-row">
            <div class="time-field">準備 <input class="prep-sec" type="number" placeholder="0"> 秒</div>
            <div class="time-field">
              <input class="sets" type="number" placeholder="1"> セット ×
              <input class="set-sec" type="number" placeholder="0"> 秒
            </div>
          </div>

          <table class="item-table">
            <thead>
              <tr>
                <th>アイテム名</th>
                <th style="width:72px">入手個数</th>
                <th style="width:90px">金額 (z)</th>
                <th style="width:80px">期待値/set</th>
              </tr>
            </thead>
            <tbody>
              ${Array.from({length: ITEM_ROWS}, () => `
                <tr class="item-row">
                  <td><input type="text" placeholder="アイテム名"></td>
                  <td><input class="qty-input" type="number" step="0.01" placeholder="0"></td>
                  <td><input class="price-input" type="number" placeholder="0"></td>
                  <td class="expected"></td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <div class="expense-area">
            <div class="expense-field">準備費用 <input class="prep-cost" type="number" placeholder="0"> z</div>
            <div class="expense-field">セット経費 <input class="set-expense" type="number" placeholder="0"> z × セット数</div>
          </div>

          <div class="result-row">
            <div class="hourly-result">時給 <span>---</span></div>
          </div>
        </div>
      `;
      card.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', () => calcCard(card));
      });
      return card;
    }

    // ---- セーブ/ロードボタン生成 ----
    function buildSlotButtons() {
      const container = document.getElementById('saveloadSlots');
      for (let i = 1; i <= SLOT_COUNT; i++) {
        const wrap = document.createElement('div');
        wrap.className = 'slot-btn';

        const label = document.createElement('span');
        label.className = 'slot-label';
        label.textContent = `スロット${i}`;

        const saveBtn = document.createElement('button');
        saveBtn.className = 'slot-save';
        saveBtn.textContent = 'セーブ';
        saveBtn.addEventListener('click', () => saveSlot(i));

        const loadBtn = document.createElement('button');
        loadBtn.className = 'slot-load empty';
        loadBtn.dataset.slot = i;
        loadBtn.textContent = '(空)';
        loadBtn.addEventListener('click', () => {
          if (slotHasData(i)) loadSlot(i);
        });

        wrap.appendChild(label);
        wrap.appendChild(saveBtn);
        wrap.appendChild(loadBtn);
        container.appendChild(wrap);
      }
      updateSlotButtons();
    }

    // ---- 初期化 ----
    const grid = document.getElementById('simGrid');
    for (let i = 0; i < CARD_COUNT; i++) grid.appendChild(buildCard());
    buildSlotButtons();
  </script>

</body>
</html>
