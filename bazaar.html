<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>露店巡り - RO活動日記</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .page-hero { padding: 40px 40px 32px; max-width: 1200px; margin: 0 auto; border-bottom: 1px solid var(--border); }
    .page-hero h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .page-hero p  { font-size: 13px; color: var(--text-light); }

    .bazaar-wrap { max-width: 1200px; margin: 0 auto; padding: 24px 40px 60px; }

    /* 日付タブ（複数選択トグル式） */
    .date-tabs { display: flex; gap: 4px; margin-bottom: 20px; flex-wrap: wrap; }
    .date-tab {
      font-size: 13px; padding: 6px 14px;
      border: 1px solid var(--border); border-radius: 4px;
      background: #fff; cursor: pointer; color: var(--text-light);
      font-family: 'Noto Sans JP', sans-serif; transition: all 0.12s;
      user-select: none;
    }
    .date-tab:hover { background: #f5f5f5; }
    .date-tab.active { background: var(--text); color: #fff; border-color: var(--text); }

    /* フィルターエリア */
    .filter-area {
      border: 1px solid var(--border); border-radius: 6px;
      padding: 16px 20px; margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px 16px;
    }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    .filter-label { font-size: 11px; color: var(--text-light); font-weight: 500; letter-spacing: 0.05em; }
    .filter-select, .filter-input {
      font-size: 13px; font-family: 'Noto Sans JP', sans-serif;
      border: 1px solid var(--border); border-radius: 4px;
      padding: 5px 8px; outline: none; color: var(--text); background: #fff;
    }
    .filter-select:focus, .filter-input:focus { border-color: #aaa; }
    .filter-range { display: flex; gap: 6px; align-items: center; }
    .filter-range input { flex: 1; min-width: 0; }
    .filter-range span { font-size: 11px; color: var(--text-light); }

    .filter-actions { display: flex; gap: 8px; align-items: flex-end; }
    .btn-filter {
      font-size: 13px; font-family: 'Noto Sans JP', sans-serif;
      padding: 6px 16px; border-radius: 4px; cursor: pointer;
      border: 1px solid var(--border); background: var(--text); color: #fff;
      transition: opacity 0.12s;
    }
    .btn-filter:hover { opacity: 0.8; }
    .btn-reset {
      font-size: 13px; font-family: 'Noto Sans JP', sans-serif;
      padding: 6px 12px; border-radius: 4px; cursor: pointer;
      border: 1px solid var(--border); background: #fff; color: var(--text-light);
    }
    .btn-reset:hover { background: #f5f5f5; }

    .result-status { font-size: 12px; color: var(--text-light); margin-bottom: 10px; }
    .result-status strong { color: var(--text); }

    /* テーブル */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      text-align: left; padding: 8px 10px;
      border-bottom: 2px solid var(--border);
      font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
      color: var(--text-light); white-space: nowrap;
      cursor: pointer; user-select: none;
    }
    thead th:hover { color: var(--text); }
    thead th .sort-icon { margin-left: 4px; opacity: 0.4; }
    thead th.sort-asc  .sort-icon::after { content: '▲'; }
    thead th.sort-desc .sort-icon::after { content: '▼'; }
    thead th:not(.sort-asc):not(.sort-desc) .sort-icon::after { content: '⇅'; }

    tbody tr { border-bottom: 1px solid #f0f0f0; transition: background 0.1s; }
    tbody tr:hover { background: #fafafa; }
    tbody td { padding: 8px 10px; white-space: nowrap; }

    .td-time   { color: var(--text-light); font-size: 12px; }
    .td-name   { font-weight: 500; min-width: 160px; white-space: normal; }
    .td-price  { text-align: right; font-weight: 700; }
    .td-count  { text-align: right; }
    .td-count.multi { color: #c0392b; font-weight: 700; }
    .td-center { text-align: center; }
    .td-badge  { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: 700; }
    .badge-sell { background: #e3f2fd; color: #1565c0; }
    .badge-buy  { background: #fce4ec; color: #880e4f; }

    .card-pills { display: flex; gap: 3px; flex-wrap: wrap; }
    .card-pill { font-size: 10px; padding: 1px 5px; background: #f0f0f0; border-radius: 3px; color: #555; }

    .no-data { text-align: center; padding: 60px 0; color: var(--text-light); font-size: 14px; }

    /* マップホバーポップアップ */
    .map-cell { position: relative; cursor: default; }
    .map-popup {
      display: none;
      position: fixed;
      width: 284px; height: 365px;
      background: rgba(0,0,0,0.5);
      border-radius: 4px;
      z-index: 99999;
      pointer-events: none;
    }
    .map-popup .guide-h {
      position: absolute;
      top: 50%; left: 0; right: 0;
      height: 1px; background: rgba(255,255,255,0.6);
      transform: translateY(-50%);
    }
    .map-popup .guide-v {
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 1px; background: rgba(255,255,255,0.6);
      transform: translateX(-50%);
    }
    .map-popup .guide-line {
      position: absolute;
      background: rgba(255,255,255,0.5);
    }
    .map-popup .map-dot {
      position: absolute;
      width: 12px; height: 12px;
      background: #e74c3c;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 4px rgba(0,0,0,0.8);
    }

    .pagination { display: flex; gap: 4px; margin-top: 16px; justify-content: center; flex-wrap: wrap; }
    .page-btn {
      font-size: 13px; font-family: 'Noto Sans JP', sans-serif;
      padding: 5px 12px; border: 1px solid var(--border);
      border-radius: 4px; background: #fff; cursor: pointer; color: var(--text-light);
    }
    .page-btn:hover { background: #f5f5f5; }
    .page-btn.active { background: var(--text); color: #fff; border-color: var(--text); }

    @media (max-width: 768px) {
      .page-hero { padding: 24px 20px; }
      .bazaar-wrap { padding: 16px 20px 40px; }
      .filter-area { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <a class="site-title" href="index.html">RO<span>活動</span>日記</a>
    <nav>
      <a href="bazaar.html" style="color:var(--accent)">露店巡り</a>
      <a href="md-sim.html">MD金銭効率</a>
      <a href="enchant.html">エンチャまとめ</a>
      <a class="disabled">工事中①</a>
      <a class="disabled">工事中②</a>
      <a class="disabled">工事中③</a>
      <a class="disabled">工事中④</a>
      <a href="diary.html">日記</a>
    </nav>
  </header>

  <div class="page-hero">
    <div class="hero-tag">Bazaar</div>
    <h1>露店巡り</h1>
    <p>見かけた露店です。座標ズレ、品物違い、古い情報の可能性大。<br>参考程度に…。</p>
  </div>

  <div class="bazaar-wrap">

    <!-- 日付タブ（複数選択） -->
    <div class="date-tabs" id="dateTabs"></div>

    <!-- フィルター -->
    <div class="filter-area">
      <div class="filter-group">
        <div class="filter-label">鯖</div>
        <select class="filter-select" id="fWorld">
          <option value="">すべて</option>
        </select>
      </div>
      <div class="filter-group">
        <div class="filter-label">マップ</div>
        <select class="filter-select" id="fMap">
          <option value="">すべて</option>
        </select>
      </div>
      <div class="filter-group">
        <div class="filter-label">種別</div>
        <select class="filter-select" id="fType">
          <option value="">すべて</option>
        </select>
      </div>
      <div class="filter-group">
        <div class="filter-label">精錬値 (以上)</div>
        <input class="filter-input" type="number" id="fRefine" placeholder="0以上">
      </div>
      <div class="filter-group">
        <div class="filter-label">超越 (以上)</div>
        <input class="filter-input" type="number" id="fTrans" placeholder="0以上">
      </div>
      <div class="filter-group">
        <div class="filter-label">アイテム名検索</div>
        <input class="filter-input" type="text" id="fName" placeholder="部分一致">
      </div>
      <div class="filter-group">
        <div class="filter-label">個数</div>
        <div class="filter-range">
          <input class="filter-input" type="number" id="fQtyMin" placeholder="以上">
          <span>〜</span>
          <input class="filter-input" type="number" id="fQtyMax" placeholder="以下">
        </div>
      </div>
      <div class="filter-group">
        <div class="filter-label">価格 (z)</div>
        <div class="filter-range">
          <input class="filter-input" type="number" id="fPriceMin" placeholder="以上">
          <span>〜</span>
          <input class="filter-input" type="number" id="fPriceMax" placeholder="以下">
        </div>
      </div>
      <div class="filter-group" style="justify-content: flex-end;">
        <label style="display:flex; align-items:center; gap:6px; font-size:13px; cursor:pointer; color:var(--text);">
          <input type="checkbox" id="fDedupe" style="width:15px;height:15px;cursor:pointer;">
          重複はまとめる
        </label>
      </div>
      <div class="filter-actions">
        <button class="btn-filter" onclick="applyFilter()">絞り込む</button>
        <button class="btn-reset" onclick="resetFilter()">リセット</button>
      </div>
    </div>

    <div class="result-status" id="resultStatus"></div>

    <div class="table-wrap">
      <table id="bazaarTable">
        <thead>
          <tr>
            <th data-col="time">時刻<span class="sort-icon"></span></th>
            <th data-col="world">鯖<span class="sort-icon"></span></th>
            <th data-col="map">マップ<span class="sort-icon"></span></th>
            <th data-col="x">X<span class="sort-icon"></span></th>
            <th data-col="y">Y<span class="sort-icon"></span></th>
            <th data-col="type">種別<span class="sort-icon"></span></th>
            <th data-col="refine">精錬<span class="sort-icon"></span></th>
            <th data-col="trans">超越<span class="sort-icon"></span></th>
            <th data-col="name">アイテム名<span class="sort-icon"></span></th>
            <th data-col="count">個数<span class="sort-icon"></span></th>
            <th data-col="price">価格(z)<span class="sort-icon"></span></th>
            <th>カードorエンチャ</th>
          </tr>
        </thead>
        <tbody id="bazaarBody"></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination"></div>

  </div>

  <footer>© 2026 RO活動日記</footer>

  <script>
    const PAGE_SIZE   = 500;
    let allData       = {};   // { 'YYYY-MM-DD': [...] } 日付ごとのデータ
    let filtered      = [];
    let currentPage   = 1;
    let sortCol       = 'time';
    let sortDir       = -1;
    let selectedDates = new Set(); // 選択中の日付セット

    // ---- 日付フォーマット ----
    function formatDate(d) {
      const y   = d.getFullYear();
      const m   = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    }

    // ---- JSONロード（1日分） ----
    async function loadDate(dateStr) {
      if (allData[dateStr] !== undefined) return; // キャッシュ済み
      const url = `data/bazaar_${dateStr}.json?_=${Date.now()}`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error();
        allData[dateStr] = await res.json();
      } catch {
        allData[dateStr] = [];
      }
    }

    // ---- 日付タブ生成 ----
    function buildDateTabs() {
      const container = document.getElementById('dateTabs');
      container.innerHTML = '';
      const today  = new Date();
      const labels = ['今日','昨日','2日前','3日前','4日前','5日前','6日前'];

      for (let i = 0; i < 7; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        const str = formatDate(d);
        const btn = document.createElement('button');
        btn.className   = 'date-tab' + (i === 0 ? ' active' : '');
        btn.textContent = `${labels[i]}（${str}）`;
        btn.dataset.date = str;

        btn.addEventListener('click', async () => {
          if (selectedDates.has(str)) {
            // 選択解除（最低1つは残す）
            if (selectedDates.size > 1) {
              selectedDates.delete(str);
              btn.classList.remove('active');
            }
          } else {
            // 選択追加
            selectedDates.add(str);
            btn.classList.add('active');
            await loadDate(str);
          }
          buildSelects();
          applyFilter();
        });

        container.appendChild(btn);
      }

      // 今日を初期選択
      const todayStr = formatDate(today);
      selectedDates.add(todayStr);
    }

    // ---- 選択中の全データを結合 ----
    function getMergedData() {
      let merged = [];
      selectedDates.forEach(d => {
        if (allData[d]) merged = merged.concat(allData[d]);
      });
      return merged;
    }

    // ---- セレクト動的生成 ----
    function buildSelects() {
      const data = getMergedData();
      fillSelect('fType',  [...new Set(data.map(r => r.type).filter(Boolean))].sort());
      fillSelect('fWorld', [...new Set(data.map(r => r.world).filter(Boolean))].sort());
      fillSelect('fMap',   [...new Set(data.map(r => r.map).filter(Boolean))].sort());
    }

    function fillSelect(id, options) {
      const sel = document.getElementById(id);
      const cur = sel.value;
      sel.innerHTML = '<option value="">すべて</option>';
      options.forEach(o => {
        const opt = document.createElement('option');
        opt.value = opt.textContent = o;
        sel.appendChild(opt);
      });
      sel.value = cur;
    }

    // ---- フィルター ----
    function applyFilter() {
      const type     = document.getElementById('fType').value;
      const world    = document.getElementById('fWorld').value;
      const map      = document.getElementById('fMap').value;
      const priceMin = parseFloat(document.getElementById('fPriceMin').value);
      const priceMax = parseFloat(document.getElementById('fPriceMax').value);
      const qtyMin   = parseFloat(document.getElementById('fQtyMin').value);
      const qtyMax   = parseFloat(document.getElementById('fQtyMax').value);
      const refine   = parseFloat(document.getElementById('fRefine').value);
      const trans    = parseFloat(document.getElementById('fTrans').value);
      const name     = document.getElementById('fName').value.trim();

      filtered = getMergedData().filter(r => {
        if (type  && r.type  !== type)  return false;
        if (world && r.world !== world) return false;
        if (map   && r.map   !== map)   return false;
        if (!isNaN(priceMin) && r.price < priceMin) return false;
        if (!isNaN(priceMax) && r.price > priceMax) return false;
        if (!isNaN(qtyMin)   && r.count < qtyMin)   return false;
        if (!isNaN(qtyMax)   && r.count > qtyMax)   return false;
        if (!isNaN(refine)   && r.refine < refine)   return false;
        if (!isNaN(trans)    && r.trans  < trans)    return false;
        if (name && !r.name.includes(name) && ![r.card1, r.card2, r.card3, r.card4].some(c => c && c.includes(name))) return false;
        return true;
      });

      currentPage = 1;

      // 重複まとめ（全列が同じものは最新1件だけ残す）
      if (document.getElementById('fDedupe').checked) {
        const seen = new Map();
        filtered.forEach(r => {
          const key = `${r.world}_${r.map}_${r.x}_${r.y}_${r.type}_${r.refine}_${r.trans}_${r.name}_${r.count}_${r.price}_${r.card1}_${r.card2}_${r.card3}_${r.card4}`;
          if (!seen.has(key) || r.time > seen.get(key).time) {
            seen.set(key, r);
          }
        });
        filtered = Array.from(seen.values());
      }

      renderTable();
    }

    function resetFilter() {
      ['fType','fWorld','fMap'].forEach(id => document.getElementById(id).value = '');
      ['fPriceMin','fPriceMax','fQtyMin','fQtyMax','fRefine','fTrans','fName']
        .forEach(id => document.getElementById(id).value = '');
      applyFilter();
    }

    // ---- ソート ----
    document.querySelectorAll('thead th[data-col]').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.col;
        sortDir = (sortCol === col) ? sortDir * -1 : 1;
        sortCol = col;
        document.querySelectorAll('thead th').forEach(t => t.classList.remove('sort-asc','sort-desc'));
        th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
        renderTable();
      });
    });

    // ---- テーブル描画 ----
    function renderTable() {
      let rows = [...filtered];

      if (sortCol) {
        rows.sort((a, b) => {
          const av = a[sortCol] ?? '';
          const bv = b[sortCol] ?? '';
          return av < bv ? -sortDir : av > bv ? sortDir : 0;
        });
      }

      const total = rows.length;
      const start = (currentPage - 1) * PAGE_SIZE;
      const page  = rows.slice(start, start + PAGE_SIZE);

      document.getElementById('resultStatus').innerHTML =
        `<strong>${total.toLocaleString()}</strong> 件`;

      const tbody = document.getElementById('bazaarBody');
      if (page.length === 0) {
        tbody.innerHTML = `<tr><td colspan="12" class="no-data">データがありません</td></tr>`;
      } else {
        tbody.innerHTML = page.map(r => {
          const cards = [r.card1, r.card2, r.card3, r.card4].filter(Boolean);
          const cardHtml = cards.length
            ? `<div class="card-pills">${cards.map(c => `<span class="card-pill">${c}</span>`).join('')}</div>`
            : '';
          const badge = r.type === '買取露店'
            ? `<span class="td-badge badge-buy">買取</span>`
            : `<span class="td-badge badge-sell">露店</span>`;
          const refineStr = r.refine > 0 ? `+${r.refine}` : '-';
          const transStr  = r.trans  > 0 ? `${r.trans}`   : '-';
          const MAP_W = 284; const MAP_H = 365; const MAP_MAX = 500;
          const dotX = (r.x / MAP_MAX) * 100;
          const dotY = (1 - r.y / MAP_MAX) * 100;

          // 追加ライン（実座標→ピクセル変換）
          // x78,y281～x78,y126 : 縦線 x=78, y=126～281
          // x78,y126～x78,y233 : 縦線 x=78, y=126～233 ※上と連続なので1本でまとめ
          // x233,y281～x233,y78: 縦線 x=233, y=78～281
          const toP = (v) => (v / MAP_MAX * 100).toFixed(2);
          const toPI = (v) => ((1 - v / MAP_MAX) * 100).toFixed(2);

          // line1: x=78, y=126～281 (縦線)
          const l1_x = (78 / MAP_MAX * MAP_W).toFixed(1);
          const l1_y1 = ((1 - 281 / MAP_MAX) * MAP_H).toFixed(1);
          const l1_h = ((281 - 126) / MAP_MAX * MAP_H).toFixed(1);

          // line2: x=233, y=78～281 (縦線)
          const l2_x = (233 / MAP_MAX * MAP_W).toFixed(1);
          const l2_y1 = ((1 - 281 / MAP_MAX) * MAP_H).toFixed(1);
          const l2_h = ((281 - 78) / MAP_MAX * MAP_H).toFixed(1);

          return `<tr class="data-row">
            <td class="td-time">${r.time}</td>
            <td>${r.world ?? ''}</td>
            <td class="map-cell" data-x="${r.x}" data-y="${r.y}">${r.map ?? ''}
              <div class="map-popup">
                <div class="guide-h"></div>
                <div class="guide-v"></div>
                <div class="guide-line" style="left:${l1_x}px;top:${l1_y1}px;width:1px;height:${l1_h}px;"></div>
                <div class="guide-line" style="left:${l2_x}px;top:${l2_y1}px;width:1px;height:${l2_h}px;"></div>
                <div class="map-dot" style="left:${dotX}%;top:${dotY}%"></div>
              </div>
            </td>
            <td class="td-center">${r.x ?? ''}</td>
            <td class="td-center">${r.y ?? ''}</td>
            <td>${badge}</td>
            <td class="td-center">${refineStr}</td>
            <td class="td-center">${transStr}</td>
            <td class="td-name">${r.name}</td>
            <td class="${countClass}">${r.count.toLocaleString()}</td>
            <td class="td-price">${r.price.toLocaleString()}</td>
            <td>${cardHtml}</td>
          </tr>`;
        }).join('');
      }

      renderPagination(total);
    }

    function renderPagination(total) {
      const pages     = Math.ceil(total / PAGE_SIZE);
      const container = document.getElementById('pagination');
      if (pages <= 1) { container.innerHTML = ''; return; }
      let html = '';
      for (let i = 1; i <= pages; i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}"
          onclick="gotoPage(${i})">${i}</button>`;
      }
      container.innerHTML = html;
    }

    function gotoPage(p) {
      currentPage = p;
      renderTable();
      window.scrollTo(0, 0);
    }

    // ---- マップポップアップ マウス追従 ----
    document.getElementById('bazaarBody').addEventListener('mouseover', e => {
      const cell = e.target.closest('.map-cell');
      if (!cell) return;
      const popup = cell.querySelector('.map-popup');
      if (popup) popup.style.display = 'block';
    });
    document.getElementById('bazaarBody').addEventListener('mouseout', e => {
      const cell = e.target.closest('.map-cell');
      if (!cell) return;
      const popup = cell.querySelector('.map-popup');
      if (popup) popup.style.display = 'none';
    });
    document.addEventListener('mousemove', e => {
      const popup = document.querySelector('.map-popup[style*="block"]');
      if (!popup) return;
      const pw = 284; const ph = 365;
      let left = e.clientX + 16;
      let top  = e.clientY - ph / 2;
      if (left + pw > window.innerWidth)  left = e.clientX - pw - 16;
      if (top < 0)                        top  = 0;
      if (top + ph > window.innerHeight)  top  = window.innerHeight - ph;
      popup.style.left = left + 'px';
      popup.style.top  = top  + 'px';
    });

    // ---- Enterキーで絞り込み ----
    document.querySelectorAll('.filter-input').forEach(inp => {
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') applyFilter();
      });
    });

    // ---- 初期化 ----
    async function init() {
      buildDateTabs();
      const todayStr = formatDate(new Date());
      await loadDate(todayStr);
      buildSelects();
      // デフォルトソート（時刻降順）のアイコンを表示
      const timeTh = document.querySelector('thead th[data-col="time"]');
      if (timeTh) timeTh.classList.add('sort-desc');
      applyFilter();
    }

    init();
  </script>

</body>
</html>
